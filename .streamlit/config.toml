[theme]
base = "light"
primaryColor = "#8F2E40"
backgroundColor = "#FFFAF2"
secondaryBackgroundColor = "#F5E8D2"
textColor = "#38231F"
linkColor = "#7C2839"
borderColor = "#C9A35D"
codeBackgroundColor = "#EEE0C8"
baseRadius = "16px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#35191C"
secondaryBackgroundColor = "#4B2227"
textColor = "#F7EAD6"
borderColor = "#A77F43"
primaryColor = "#D6AD5E"
